name: Branch

# Runner: ubuntu-latest (public artus-engineering org) — see docs/ci.md.

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: branch-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and format
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: artus-engineering/.github/actions/setup-pnpm@feb73e3bc8a16c61582dd578627ba5d6dc07e2ca

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          check-latest: false
          package-manager-cache: false
          node-version: "26"

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          tools: composer
          coverage: none

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Lint
        run: pnpm run lint

      - name: Check JavaScript formatting
        run: pnpm exec biome format .

      - name: Widget contract unit tests
        run: pnpm test:unit

  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: artus-engineering/.github/actions/setup-pnpm@feb73e3bc8a16c61582dd578627ba5d6dc07e2ca

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          check-latest: false
          package-manager-cache: false
          node-version: "26"

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          tools: composer
          coverage: none

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Build Gutenberg block
        run: pnpm run build:block

      - name: Verify version consistency
        run: ./scripts/bump-version.sh --check

      - name: Verify plugin ZIP build
        run: ./scripts/build.sh

  scan:
    name: SonarQube Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # Shallow clones should be disabled for a better relevancy of analysis

      - name: Analyze with SonarQube
        uses: SonarSource/sonarqube-scan-action@v8
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

      - name: SonarQube Quality Gate
        uses: SonarSource/sonarqube-quality-gate-action@v1
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
    if: ${{ github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]') }}
